insmod all_video
insmod gfxterm
insmod gfxmenu
insmod png
set synterra_theme_dir="${config_directory}/themes/SynterraPrism"
for size in 16 18 24 32; do
    loadfont "${synterra_theme_dir}/synterra-${size}.pf2"
done
set gfxmode=1280x720,1024x768,800x600,auto
set gfxpayload=keep
set gfxterm_font="Synterra Regular 16"
terminal_output gfxterm
set theme="${synterra_theme_dir}/theme.txt"
export theme
